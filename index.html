<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gurukrupa Tours & Travels - Customer Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .seat { transition: all 0.2s ease; }
        .seat.selected { background-color: #d84e55 !important; color: white !important; border-color: #b83238 !important; }
        .seat.selected .price-tag { color: white !important; }
        .seat.booked { background-color: #9ca3af !important; color: #374151 !important; border-color: #6b7280 !important; cursor: not-allowed; opacity: 0.7; }
        .seat.booked .price-tag { color: #374151 !important; }
        .tab-btn.active { background-color: #d84e55; color: white; border-color: #d84e55; }
        .time-btn.selected { background-color: #d84e55; color: white; border-color: #d84e55; }
        .route-btn.active { background-color: #d84e55; color: white; border-color: #d84e55; }
    </style>
</head>
<body class="bg-gray-100 font-sans pb-10">

    <header class="bg-[#d84e55] text-white p-2.5 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="w-11 h-11 bg-black rounded-full border-2 border-yellow-500 flex items-center justify-center shadow-md shrink-0">
                    <span class="text-yellow-500 font-black text-xl tracking-tighter">GK</span>
                </div>
                <div>
                    <h1 class="text-base font-black tracking-wide text-yellow-300 uppercase leading-none">GURUKRUPA</h1>
                    <p class="text-[9px] tracking-widest text-white uppercase font-bold">CUSTOMER PORTAL</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <div id="user-badge" class="hidden text-xs bg-[#b83238] px-2 py-1 rounded border border-yellow-400 font-semibold">
                    <span id="user-name-display"></span>
                </div>
                <button id="logout-btn" onclick="logout()" class="hidden bg-yellow-500 hover:bg-yellow-600 text-black px-2 py-1 rounded text-xs font-bold shadow">
                    <i class="fa-solid fa-right-from-bracket"></i> बाहेर
                </button>
            </div>
        </div>
    </header>

    <div class="container mx-auto p-3 max-w-xl">
        <!-- लॉगिन स्क्रीन -->
        <div id="screen-login" class="bg-white p-5 rounded-xl shadow-lg border border-gray-200 mt-4">
            <h2 class="text-base font-bold text-gray-800 text-center mb-1">कस्टमर लॉगिन (Customer Login)</h2>
            <p class="text-[11px] text-gray-500 text-center mb-4">प्रवासाचे बुकिंग करण्यासाठी तुमची माहिती प्रविष्ट करा</p>

            <div class="space-y-3 mt-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">पूर्ण नाव (Full Name) *</label>
                    <input type="text" id="login-name" placeholder="तुमचे नाव टाका" class="w-full p-2 border rounded text-xs outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">मोबाईल नंबर *</label>
                    <input type="tel" id="login-phone" placeholder="10 अंकी मोबाईल नंबर टाका" class="w-full p-2 border rounded text-xs outline-none">
                </div>
                <button onclick="handleLogin()" class="w-full bg-[#d84e55] text-white font-bold py-2.5 rounded-lg text-xs shadow mt-2">
                    प्रवेश करा (Continue)
                </button>
            </div>
        </div>

        <!-- कस्टमर डॅशबोर्ड -->
        <div id="screen-customer" class="hidden">
            <div class="grid grid-cols-3 gap-1.5 mb-4 text-xs font-semibold">
                <button onclick="switchTab('sharing')" id="tab-sharing" class="tab-btn active p-2 rounded-lg border bg-white shadow-sm">1. Sharing</button>
                <button onclick="switchTab('oneway')" id="tab-oneway" class="tab-btn p-2 rounded-lg border bg-white shadow-sm">2. One Way</button>
                <button onclick="switchTab('airport')" id="tab-airport" class="tab-btn p-2 rounded-lg border bg-white shadow-sm">3. Airport Drop</button>
                <button onclick="switchTab('fleet')" id="tab-fleet" class="tab-btn p-2 rounded-lg border bg-white shadow-sm">4. Fleet (Per KM)</button>
                <button onclick="switchTab('darshan')" id="tab-darshan" class="tab-btn p-2 rounded-lg border bg-white shadow-sm">5. नाशिक दर्शन</button>
                <button onclick="switchTab('packages')" id="tab-packages" class="tab-btn p-2 rounded-lg border bg-white shadow-sm">6. Packages</button>
                <button onclick="switchTab('buses')" id="tab-buses" class="tab-btn col-span-3 p-2 rounded-lg border bg-white shadow-sm text-[#d84e55] font-bold">7. Buses Inquiry</button>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-md border border-gray-200">
                <div class="mb-4 border-b pb-2 flex justify-between items-center bg-gray-50 p-2 rounded">
                    <div class="text-xs">
                        <span class="font-bold text-gray-700">ग्राहक:</span> <span id="cust-display-name" class="font-semibold text-[#d84e55]"></span> 
                        (<span id="cust-display-phone" class="text-gray-600"></span>)
                    </div>
                </div>

                <div id="section-sharing" class="booking-section">
                    <div class="flex gap-2 mb-3">
                        <button type="button" id="btn-route-np" onclick="selectRoute('nashik-pune')" class="route-btn active flex-1 p-2 text-xs font-bold border rounded-lg shadow-sm border-[#d84e55] text-center">नाशिक ते पुणे</button>
                        <button type="button" id="btn-route-pn" onclick="selectRoute('pune-nashik')" class="route-btn flex-1 p-2 text-xs font-bold border rounded-lg shadow-sm border-gray-300 text-gray-700 text-center">पुणे ते नाशिक</button>
                    </div>

                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 mb-1">पिकअप पॉईंट *</label>
                            <select id="sharing-pickup" class="w-full p-1.5 border rounded text-xs font-semibold bg-white"></select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 mb-1">ड्रॉप पॉईंट *</label>
                            <select id="sharing-drop" class="w-full p-1.5 border rounded text-xs font-semibold bg-white"></select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 mb-1">प्रवासाची तारीख *</label>
                            <input type="date" id="sharing-date" class="w-full p-1.5 border rounded text-xs">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 mb-1">गाडी / सर्व्हिस *</label>
                            <select id="car-select" class="w-full p-1.5 border rounded text-xs font-bold text-[#d84e55]">
                                <option value="ertiga">Ertiga (6 Seater)</option>
                                <option value="ciaz">Ciaz (4 Seater)</option>
                            </select>
                        </div>
                    </div>

                    <div class="bg-gray-50 p-3 rounded-lg border-2 border-gray-300 mb-3">
                        <div class="space-y-3">
                            <div class="flex justify-between items-center bg-gray-200 p-1.5 rounded-md">
                                <button type="button" data-seat-code="F1" onclick="toggleSeat(this, 'Front Seat (F1) - ₹750')" class="seat w-20 h-12 bg-white border-2 border-green-600 rounded flex flex-col items-center justify-center">
                                    <span class="price-tag text-[10px] font-bold text-green-700">₹750</span>
                                    <span class="text-xs font-black">F1</span>
                                </button>
                                <div class="w-16 h-10 bg-gray-400 text-white rounded flex items-center justify-center text-xs font-bold">Driver</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="payment-section" class="mt-5 border-t-2 border-dashed border-gray-300 pt-4 text-center">
                    <h4 class="text-sm font-bold text-gray-800">Shashiraj Rahane (QR Code)</h4>
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150&data=upi://pay?pa=shash74.s7@oksbi&pn=Shashiraj%20Rahane" class="w-32 h-32 mx-auto my-2 rounded border p-1 bg-white">
                    <div class="text-left bg-red-50 p-3 rounded border border-red-200 mt-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="paymentConfirmCheckbox" class="w-4 h-4 text-[#d84e55] rounded">
                            <span class="text-[11px] font-bold text-red-600">मी QR कोडद्वारे पेमेंट केले आहे *</span>
                        </label>
                    </div>
                </div>

                <button onclick="submitBooking()" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl shadow-lg flex justify-center items-center gap-2 mt-4 text-sm">
                    <i class="fa-brands fa-whatsapp text-lg"></i> बुकिंग सेव्ह करा
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const db = getDatabase(initializeApp({
            databaseURL: "https://gurukrupa--tours--travels-default-rtdb.firebaseio.com"
        }));

        window.currentUser = null;
        window.selectedSeats = [];

        window.handleLogin = function() {
            const name = document.getElementById('login-name').value.trim();
            const phone = document.getElementById('login-phone').value.trim();
            if(!name || phone.length < 10) { alert('नाव व वैध मोबाईल नंबर टाका'); return; }
            const user = { name, phone };
            localStorage.setItem('gk_customer', JSON.stringify(user));
            applyUser(user);
        };

        function applyUser(u) {
            window.currentUser = u;
            document.getElementById('screen-login').classList.add('hidden');
            document.getElementById('screen-customer').classList.remove('hidden');
            document.getElementById('user-badge').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
            document.getElementById('user-name-display').innerText = u.name;
            document.getElementById('cust-display-name').innerText = u.name;
            document.getElementById('cust-display-phone').innerText = u.phone;
        }

        window.logout = function() {
            localStorage.removeItem('gk_customer');
            location.reload();
        };

        window.addEventListener('load', () => {
            const s = localStorage.getItem('gk_customer');
            if(s) applyUser(JSON.parse(s));
        });

        window.toggleSeat = (btn, s) => {
            btn.classList.toggle('selected');
            if(window.selectedSeats.includes(s)) window.selectedSeats = window.selectedSeats.filter(x=>x!==s);
            else window.selectedSeats.push(s);
        };

        window.submitBooking = function() {
            if(!document.getElementById('paymentConfirmCheckbox').checked) { alert('पेमेंट चेकबॉक्स निवडा'); return; }
            push(ref(db, 'bookings/'), {
                customerName: window.currentUser.name,
                customerPhone: window.currentUser.phone,
                seats: window.selectedSeats,
                date: new Date().toISOString()
            }).then(() => alert('बुकिंग यशस्वीरित्या सेव्ह झाली!'));
        };
    </script>
</body>
</html>
