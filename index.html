            <div class="card-stack-container mb-2" id="swipeArea">

                <!-- 1. Customer Card -->
                <div id="card-customer" class="stacked-card layer-0 border-2 border-redbus p-4 text-center flex flex-col justify-center items-center">
                    <div class="w-11 h-11 bg-red-100 text-redbus rounded-full flex items-center justify-center mb-1">
                        <i class="fa-solid fa-user text-lg"></i>
                    </div>
                    <p class="text-sm font-black text-gray-800">1. Customer</p>
                    <p class="text-[11px] text-gray-500 font-medium">कस्टमर पोर्टल</p>
                </div>

                <!-- 2. Owner Card -->
                <div id="card-owner" class="stacked-card layer-1 border-2 border-amber-500 p-4 text-center flex flex-col justify-center items-center">
                    <div class="w-11 h-11 bg-amber-100 text-amber-700 rounded-full flex items-center justify-center mb-1">
                        <i class="fa-solid fa-user-tie text-lg"></i>
                    </div>
                    <p class="text-sm font-black text-gray-800">2. Owner</p>
                    <p class="text-[11px] text-gray-500 font-medium">ओनर पोर्टल</p>
                </div>

                <!-- 3. Driver Card -->
                <div id="card-driver" class="stacked-card layer-2 border-2 border-blue-500 p-4 text-center flex flex-col justify-center items-center">
                    <div class="w-11 h-11 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center mb-1">
                        <i class="fa-solid fa-id-card text-lg"></i>
                    </div>
                    <p class="text-sm font-black text-gray-800">3. Driver</p>
                    <p class="text-[11px] text-gray-500 font-medium">ड्रायव्हर पोर्टल</p>
                </div>

            </div>

            <!-- Controls & Dots -->
            <div class="flex items-center justify-between px-6 mb-4">
                <button onclick="prevCard()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 flex items-center justify-center shadow-sm">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <div class="flex gap-1.5">
                    <div id="dot-customer" class="w-4 h-1.5 rounded-full bg-redbus transition-all duration-300"></div>
                    <div id="dot-owner" class="w-1.5 h-1.5 rounded-full bg-gray-300 transition-all duration-300"></div>
                    <div id="dot-driver" class="w-1.5 h-1.5 rounded-full bg-gray-300 transition-all duration-300"></div>
                </div>
                <button onclick="nextCard()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 flex items-center justify-center shadow-sm">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
            </div>

            <!-- Login Form -->
            <div class="space-y-3 border-t pt-4">
                <p id="selected-role-title" class="text-xs font-extrabold text-redbus text-center uppercase tracking-wide">
                    Customer Login Form
                </p>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">पूर्ण नाव (Full Name) *</label>
                    <input type="text" id="login-name" placeholder="तुमचे नाव टाका" class="w-full p-2.5 border border-gray-300 rounded-lg text-xs outline-none focus:ring-1 focus:ring-redbus">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">मोबाईल नंबर *</label>
                    <input type="tel" id="login-phone" placeholder="10 अंकी मोबाईल नंबर" class="w-full p-2.5 border border-gray-300 rounded-lg text-xs outline-none focus:ring-1 focus:ring-redbus">
                </div>
                <div id="password-field" class="hidden">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">पासवर्ड (Password) *</label>
                    <input type="password" id="login-pass" placeholder="पासवर्ड टाका" class="w-full p-2.5 border border-gray-300 rounded-lg text-xs outline-none focus:ring-1 focus:ring-redbus">
                </div>

                <button onclick="handleLogin()" class="w-full bg-redbus hover:bg-redbusDark text-white font-bold py-3 rounded-lg text-xs shadow-md mt-2 transition">
                    लॉगिन करा (Login)
                </button>
            </div>
        </div>

        <!-- ================= 2. CUSTOMER PORTAL ================= -->
        <div id="screen-customer" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-md border border-gray-200">
                <h3 class="text-xs font-bold text-gray-700 mb-3 border-b pb-1"><i class="fa-solid fa-route text-redbus"></i> प्रवास निवडा</h3>
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-500">कुठून (From)</label>
                        <select class="w-full p-2 border rounded text-xs"><option>पुणे</option><option>मुंबई</option></select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-500">कुठे (To)</label>
                        <select class="w-full p-2 border rounded text-xs"><option>नागपूर</option><option>नाशिक</option></select>
                    </div>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-md border border-gray-200">
                <h3 class="text-xs font-bold text-gray-700 mb-3"><i class="fa-solid fa-bus text-redbus"></i> जागा निवडा (Select Seats)</h3>
                <div class="grid grid-cols-4 gap-2 bg-gray-50 p-3 rounded-lg border border-gray-200">
                    <button onclick="toggleSeat(this, 'A1')" class="seat-btn bg-white border border-green-500 text-green-700 text-xs py-2 rounded font-bold">A1</button>
                    <button onclick="toggleSeat(this, 'A2')" class="seat-btn bg-white border border-green-500 text-green-700 text-xs py-2 rounded font-bold">A2</button>
                    <div class="col-span-1"></div>
                    <button onclick="toggleSeat(this, 'A3')" class="seat-btn bg-white border border-green-500 text-green-700 text-xs py-2 rounded font-bold">A3</button>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-md border border-gray-200 flex justify-between items-center">
                <div>
                    <p class="text-[11px] text-gray-500">सीट्स: <span id="selected-seats-list" class="font-bold text-gray-800">काहीही नाही</span></p>
                    <p class="text-sm font-black text-gray-800">एकूण: ₹<span id="total-fare">0</span></p>
                </div>
                <button onclick="confirmBooking()" class="bg-redbus hover:bg-redbusDark text-white px-4 py-2 rounded-lg text-xs font-bold shadow">
                    बुकिंग कन्फर्म करा
                </button>
            </div>
        </div>

        <!-- ================= 3. OWNER DASHBOARD ================= -->
        <div id="screen-owner" class="hidden bg-white p-4 rounded-xl shadow border">
            <h3 class="text-xs font-bold text-amber-600 mb-2"><i class="fa-solid fa-chart-line"></i> ओनर डॅशबोर्ड</h3>
            <p class="text-xs text-gray-600">आजचे उत्पन्न: <strong>₹ 10,500</strong></p>
        </div>

        <!-- ================= 4. DRIVER DASHBOARD ================= -->
        <div id="screen-driver" class="hidden bg-white p-4 rounded-xl shadow border">
            <h3 class="text-xs font-bold text-blue-600 mb-2"><i class="fa-solid fa-bus-simple"></i> ड्रायव्हर डॅशबोर्ड</h3>
            <p class="text-xs text-gray-600">गाडी क्र: <strong>MH-15-AB-1234</strong></p>
        </div>

    </div>

    <!-- JavaScript -->
    <script>
        const roles = ['customer', 'owner', 'driver'];
        let currentIndex = 0;
        let selectedSeats = [];

        function updateStackVisuals() {
            roles.forEach((role, index) => {
                const card = document.getElementById(`card-${role}`);
                const dot = document.getElementById(`dot-${role}`);
                
                // Reset classes
                card.className = "stacked-card border-2 p-4 text-center flex flex-col justify-center items-center";
                dot.className = "w-1.5 h-1.5 rounded-full bg-gray-300 transition-all duration-300";

                // Border color by role
                if (role === 'customer') card.classList.add('border-redbus');
                if (role === 'owner') card.classList.add('border-amber-500');
                if (role === 'driver') card.classList.add('border-blue-500');

                // Calculate Stack Order Layer
                const layerPos = (index - currentIndex + roles.length) % roles.length;
                card.classList.add(`layer-${layerPos}`);

                if (layerPos === 0) {
                    dot.className = role === 'customer' ? 'w-4 h-1.5 rounded-full bg-redbus transition-all duration-300' :
                                    role === 'owner' ? 'w-4 h-1.5 rounded-full bg-amber-500 transition-all duration-300' :
                                    'w-4 h-1.5 rounded-full bg-blue-500 transition-all duration-300';
                }
            });

            // Update Form UI based on top active role
            const activeRole = roles[currentIndex];
            const passField = document.getElementById('password-field');
            const title = document.getElementById('selected-role-title');

            if (activeRole === 'customer') {
                title.innerText = "Customer Login Form";
                title.className = "text-xs font-extrabold text-redbus text-center uppercase tracking-wide";
                passField.classList.add('hidden');
            } else if (activeRole === 'owner') {
                title.innerText = "Owner Login Form";
                title.className = "text-xs font-extrabold text-amber-600 text-center uppercase tracking-wide";
                passField.classList.remove('hidden');
            } else if (activeRole === 'driver') {
                title.innerText = "Driver Login Form";
                title.className = "text-xs font-extrabold text-blue-600 text-center uppercase tracking-wide";
                passField.classList.remove('hidden');
            }
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % roles.length;
            updateStackVisuals();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + roles.length) % roles.length;
            updateStackVisuals();
        }

        // Touch Swipe Event Support
        let startX = 0;
        const swipeArea = document.getElementById('swipeArea');
        swipeArea.addEventListener('touchstart', e => startX = e.touches[0].clientX);
        swipeArea.addEventListener('touchend', e => {
            let endX = e.changedTouches[0].clientX;
            if (startX - endX > 40) nextCard();
            else if (endX - startX > 40) prevCard();
        });

        function handleLogin() {
            const name = document.getElementById('login-name').value;
            const phone = document.getElementById('login-phone').value;
            const activeRole = roles[currentIndex];

            if (!name || !phone) {
                alert('कृपया सर्व माहिती भरा.');
                return;
            }

            document.getElementById('screen-login').classList.add('hidden');
            document.getElementById('user-badge').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
            document.getElementById('user-name-display').innerText = name;
            document.getElementById('user-role-display').innerText = activeRole.toUpperCase();

            document.getElementById(`screen-${activeRole}`).classList.remove('hidden');
        }

        function toggleSeat(btn, seatNo) {
            if (selectedSeats.includes(seatNo)) {
                selectedSeats = selectedSeats.filter(s => s !== seatNo);
                btn.classList.remove('bg-redbus', 'text-white');
                btn.classList.add('bg-white', 'text-green-700');
            } else {
                selectedSeats.push(seatNo);
                btn.classList.remove('bg-white', 'text-green-700');
                btn.classList.add('bg-redbus', 'text-white');
            }
            document.getElementById('selected-seats-list').innerText = selectedSeats.length > 0 ? selectedSeats.join(', ') : 'काहीही नाही';
            document.getElementById('total-fare').innerText = selectedSeats.length * 750;
        }

        function confirmBooking() {
            if (selectedSeats.length === 0) return alert('जागा निवडा.');
            alert('बुकिंग कन्फर्म झाले!');
        }

        function logout() {
            roles.forEach(r => document.getElementById(`screen-${r}`).classList.add('hidden'));
            document.getElementById('user-badge').classList.add('hidden');
            document.getElementById('logout-btn').classList.add('hidden');
            document.getElementById('screen-login').classList.remove('hidden');
        }

        // Init
        updateStackVisuals();
    </script>
</body>
</html>
