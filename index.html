<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gurukrupa Tours & Travels - Seat Booking</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        redbus: '#d84e55',
                        redbusDark: '#b83238'
                    }
                }
            }
        }
    </script>
    <style>
        .seat {
            transition: all 0.2s ease;
        }
        .seat.selected {
            background-color: #d84e55 !important;
            color: white !important;
            border-color: #b83238 !important;
        }
        .seat.selected .price-tag {
            color: white !important;
        }
        .tab-btn.active {
            background-color: #d84e55;
            color: white;
            border-color: #d84e55;
        }
        .time-btn.selected {
            background-color: #d84e55;
            color: white;
            border-color: #d84e55;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <!-- RedBus Style Header with Logo & Owner Details -->
    <header class="bg-redbus text-white p-3 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            
            <!-- Logo & Brand Name -->
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-black rounded-full border-2 border-yellow-500 flex items-center justify-center p-1 shadow-md">
                    <!-- SVG representation of your logo -->
                    <span class="text-yellow-500 font-black text-xl tracking-tighter">GK</span>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-wide text-yellow-300 uppercase leading-none">GURUKRUPA</h1>
                    <p class="text-[10px] tracking-widest text-white uppercase font-bold">TOURS AND TRAVELS</p>
                    <p class="text-xs text-gray-200 mt-0.5">Prop: <span class="font-semibold text-white">Shashi Rahane</span></p>
                </div>
            </div>

            <!-- Contact Numbers -->
            <div class="flex gap-2">
                <a href="tel:9890896040" class="bg-white text-redbus px-2.5 py-1 rounded-full text-xs font-bold flex items-center gap-1 hover:bg-gray-100 shadow">
                    <i class="fa-solid fa-phone"></i> 9890896040
                </a>
                <a href="tel:9922862007" class="bg-white text-redbus px-2.5 py-1 rounded-full text-xs font-bold flex items-center gap-1 hover:bg-gray-100 shadow">
                    <i class="fa-solid fa-phone"></i> 9922862007
                </a>
            </div>

        </div>
    </header>

    <div class="container mx-auto p-3 max-w-lg">
        
        <!-- Navigation Tabs -->
        <div class="grid grid-cols-3 gap-1.5 mb-4 text-xs font-semibold">
            <button onclick="switchTab('sharing')" id="tab-sharing" class="tab-btn active p-2 rounded-lg border bg-white shadow-sm">1. Sharing</button>
            <button onclick="switchTab('oneway')" id="tab-oneway" class="tab-btn p-2 rounded-lg border bg-white shadow-sm">2. One Way</button>
            <button onclick="switchTab('airport')" id="tab-airport" class="tab-btn p-2 rounded-lg border bg-white shadow-sm">3. Airport</button>
            <button onclick="switchTab('fleet')" id="tab-fleet" class="tab-btn p-2 rounded-lg border bg-white shadow-sm">4. Fleet</button>
            <button onclick="switchTab('darshan')" id="tab-darshan" class="tab-btn p-2 rounded-lg border bg-white shadow-sm">5. Darshan</button>
            <button onclick="switchTab('bus')" id="tab-bus" class="tab-btn p-2 rounded-lg border bg-white shadow-sm">6. Bus Inquiry</button>
        </div>

        <!-- Main Card -->
        <div class="bg-white p-4 rounded-xl shadow-md border border-gray-200">
            
            <!-- Customer Details -->
            <div class="mb-4 border-b pb-3">
                <h2 class="text-xs font-bold text-gray-700 uppercase mb-2 flex items-center gap-1">
                    <i class="fa-solid fa-user text-redbus"></i> ग्राहक माहिती (Customer Details)
                </h2>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="cust-name" placeholder="पूर्ण नाव *" class="p-2 border rounded text-xs focus:ring-1 focus:ring-redbus outline-none">
                    <input type="tel" id="cust-phone" placeholder="मोबाईल नंबर *" class="p-2 border rounded text-xs focus:ring-1 focus:ring-redbus outline-none">
                </div>
            </div>

            <!-- 1. SHARING SECTION -->
            <div id="section-sharing" class="booking-section">
                
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">प्रवासाची तारीख *</label>
                        <input type="date" id="sharing-date" class="w-full p-1.5 border rounded text-xs">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">गाडी *</label>
                        <select onchange="selectCar(this.value)" id="car-select" class="w-full p-1.5 border rounded text-xs font-bold text-redbus">
                            <option value="ertiga">Ertiga (6 Seater)</option>
                            <option value="ciaz">Ciaz (4 Seater)</option>
                        </select>
                    </div>
                </div>

                <!-- Time Selection -->
                <div class="mb-3">
                    <label class="block text-[11px] font-semibold text-gray-600 mb-1">वेळ निवडा *</label>
                    <div class="grid grid-cols-3 gap-1.5">
                        <button type="button" onclick="selectTime(this, '04:00 AM')" class="time-btn p-1.5 text-[11px] border rounded hover:border-redbus">04:00 AM</button>
                        <button type="button" onclick="selectTime(this, '04:30 AM')" class="time-btn p-1.5 text-[11px] border rounded hover:border-redbus">04:30 AM</button>
                        <button type="button" onclick="selectTime(this, '05:00 AM')" class="time-btn p-1.5 text-[11px] border rounded hover:border-redbus">05:00 AM</button>
                        <button type="button" onclick="selectTime(this, '08:00 AM')" class="time-btn p-1.5 text-[11px] border rounded hover:border-redbus">08:00 AM</button>
                        <button type="button" onclick="selectTime(this, '08:30 AM')" class="time-btn p-1.5 text-[11px] border rounded hover:border-redbus">08:30 AM</button>
                        <button type="button" onclick="selectTime(this, '09:00 AM')" class="time-btn p-1.5 text-[11px] border rounded hover:border-redbus">09:00 AM</button>
                    </div>
                    <input type="hidden" id="sharing-time">
                </div>

                <!-- SEAT LAYOUT CONTAINER (REDBUS CAR INTERIOR STYLE) -->
                <div class="bg-gray-50 p-3 rounded-lg border-2 border-gray-300">
                    <div class="flex justify-between items-center mb-3 pb-2 border-b">
                        <span class="text-[11px] font-bold text-gray-500 uppercase">समोरची बाजू (Front)</span>
                        <div class="flex gap-2 text-[10px]">
                            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 bg-white border border-gray-400 rounded"></span> उपलब्ध</span>
                            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 bg-redbus rounded"></span> सिलेक्टेड</span>
                        </div>
                    </div>

                    <!-- ERTIGA SEAT LAYOUT (Driver Right, Passenger Left) -->
                    <div id="layout-ertiga" class="space-y-3">
                        
                        <!-- Row 1: Left Front Seat | Right Driver -->
                        <div class="flex justify-between items-center bg-gray-200 p-1.5 rounded-md">
                            <!-- Left: Front Passenger Seat -->
                            <button type="button" onclick="toggleSeat(this, 'Front Seat (F1) - ₹750')" class="seat w-20 h-12 bg-white border-2 border-green-600 rounded flex flex-col items-center justify-center shadow-sm">
                                <span class="price-tag text-[10px] font-bold text-green-700">₹750</span>
                                <span class="text-xs font-black">F1 (Front)</span>
                            </button>
                            
                            <!-- Right: Driver Seat -->
                            <div class="w-16 h-10 bg-gray-400 text-white rounded flex items-center justify-center text-xs font-bold gap-1 shadow-inner">
                                <i class="fa-solid fa-wheel"></i> Driver
                            </div>
                        </div>

                        <!-- Row 2: Middle Row (3 Compact Seats) -->
                        <div class="grid grid-cols-3 gap-1.5 bg-gray-200 p-1.5 rounded-md">
                            <button type="button" onclick="toggleSeat(this, 'Middle Left (M1) - ₹550')" class="seat h-12 bg-white border border-gray-400 rounded flex flex-col items-center justify-center shadow-sm">
                                <span class="price-tag text-[10px] font-bold text-gray-600">₹550</span>
                                <span class="text-xs font-bold">M1 (Left)</span>
                            </button>
                            <button type="button" onclick="toggleSeat(this, 'Middle Center (M2) - ₹550')" class="seat h-12 bg-white border border-gray-400 rounded flex flex-col items-center justify-center shadow-sm">
                                <span class="price-tag text-[10px] font-bold text-gray-600">₹550</span>
                                <span class="text-xs font-bold">M2 (Mid)</span>
                            </button>
                            <button type="button" onclick="toggleSeat(this, 'Middle Right (M3) - ₹550')" class="seat h-12 bg-white border border-gray-400 rounded flex flex-col items-center justify-center shadow-sm">
                                <span class="price-tag text-[10px] font-bold text-gray-600">₹550</span>
                                <span class="text-xs font-bold">M3 (Right)</span>
                            </button>
                        </div>

                        <!-- Row 3: Back Row (2 Rear Seats) -->
                        <div class="grid grid-cols-2 gap-3 bg-gray-200 p-1.5 rounded-md">
                            <button type="button" onclick="toggleSeat(this, 'Back Left (B1) - ₹550')" class="seat h-12 bg-white border border-gray-400 rounded flex flex-col items-center justify-center shadow-sm">
                                <span class="price-tag text-[10px] font-bold text-gray-600">₹550</span>
                                <span class="text-xs font-bold">B1 (Back L)</span>
                            </button>
                            <button type="button" onclick="toggleSeat(this, 'Back Right (B2) - ₹550')" class="seat h-12 bg-white border border-gray-400 rounded flex flex-col items-center justify-center shadow-sm">
                                <span class="price-tag text-[10px] font-bold text-gray-600">₹550</span>
                                <span class="text-xs font-bold">B2 (Back R)</span>
                            </button>
                        </div>

                    </div>

                    <!-- CIAZ SEAT LAYOUT (Driver Right, Passenger Left) -->
                    <div id="layout-ciaz" class="space-y-3 hidden">
                        
                        <!-- Row 1: Left Front Seat | Right Driver -->
                        <div class="flex justify-between items-center bg-gray-200 p-1.5 rounded-md">
                            <!-- Left: Front Passenger Seat -->
                            <button type="button" onclick="toggleSeat(this, 'Front Seat (F1) - ₹750')" class="seat w-20 h-12 bg-white border-2 border-green-600 rounded flex flex-col items-center justify-center shadow-sm">
                                <span class="price-tag text-[10px] font-bold text-green-700">₹750</span>
                                <span class="text-xs font-black">F1 (Front)</span>
                            </button>
                            
                            <!-- Right: Driver Seat -->
                            <div class="w-16 h-10 bg-gray-400 text-white rounded flex items-center justify-center text-xs font-bold gap-1 shadow-inner">
                                <i class="fa-solid fa-wheel"></i> Driver
                            </div>
                        </div>

                        <!-- Row 2: Rear Row (3 Seats) -->
                        <div class="grid grid-cols-3 gap-1.5 bg-gray-200 p-1.5 rounded-md">
                            <button type="button" onclick="toggleSeat(this, 'Rear Left (R1) - ₹550')" class="seat h-12 bg-white border border-gray-400 rounded flex flex-col items-center justify-center shadow-sm">
                                <span class="price-tag text-[10px] font-bold text-gray-600">₹550</span>
                                <span class="text-xs font-bold">R1 (Left)</span>
                            </button>
                            <button type="button" onclick="toggleSeat(this, 'Rear Center (R2) - ₹550')" class="seat h-12 bg-white border border-gray-400 rounded flex flex-col items-center justify-center shadow-sm">
                                <span class="price-tag text-[10px] font-bold text-gray-600">₹550</span>
                                <span class="text-xs font-bold">R2 (Mid)</span>
                            </button>
                            <button type="button" onclick="toggleSeat(this, 'Rear Right (R3) - ₹550')" class="seat h-12 bg-white border border-gray-400 rounded flex flex-col items-center justify-center shadow-sm">
                                <span class="price-tag text-[10px] font-bold text-gray-600">₹550</span>
                                <span class="text-xs font-bold">R3 (Right)</span>
                            </button>
                        </div>

                    </div>

                </div>
            </div>

            <!-- Other Sections (One Way, Airport, Fleet, Darshan, Bus) -->
            <div id="section-oneway" class="booking-section hidden space-y-2">
                <label class="block text-xs font-semibold">रूट निवडा *</label>
                <select id="oneway-route" class="w-full p-2 border rounded text-xs">
                    <option value="Nashik to Pune">Nashik To Pune</option>
                    <option value="Pune to Nashik">Pune To Nashik</option>
                    <option value="Nashik to Mumbai">Nashik To Mumbai</option>
                    <option value="Mumbai to Nashik">Mumbai To Nashik</option>
                </select>
                <label class="block text-xs font-semibold">तारीख *</label>
                <input type="date" id="oneway-date" class="w-full p-2 border rounded text-xs">
                <label class="block text-xs font-semibold">गाडी प्रकार *</label>
                <select id="oneway-car" class="w-full p-2 border rounded text-xs">
                    <option value="Sedan (₹3000)">Sedan (Dzire/Ciaz) - ₹3000</option>
                    <option value="SUV (₹4000)">SUV (Ertiga) - ₹4000</option>
                </select>
            </div>

            <div id="section-airport" class="booking-section hidden space-y-2">
                <label class="block text-xs font-semibold">एअरपोर्ट रूट *</label>
                <select id="airport-route" class="w-full p-2 border rounded text-xs">
                    <option value="Nashik to Mumbai Airport">Nashik To Mumbai Airport</option>
                    <option value="Mumbai Airport to Nashik">Mumbai Airport To Nashik</option>
                </select>
                <input type="date" id="airport-date" class="w-full p-2 border rounded text-xs">
            </div>

            <div id="section-fleet" class="booking-section hidden space-y-2">
                <input type="date" id="fleet-date" class="w-full p-2 border rounded text-xs">
                <input type="text" id="fleet-spot" placeholder="ठिकाण (Destinations)" class="w-full p-2 border rounded text-xs">
            </div>

            <div id="section-darshan" class="booking-section hidden space-y-2">
                <input type="date" id="darshan-date" class="w-full p-2 border rounded text-xs">
            </div>

            <div id="section-bus" class="booking-section hidden space-y-2">
                <textarea id="bus-msg" placeholder="बस माहिती किंवा मागणी..." class="w-full p-2 border rounded text-xs"></textarea>
            </div>

            <!-- Submit Button -->
            <button onclick="sendWhatsApp()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl shadow flex justify-center items-center gap-2 mt-4 text-sm">
                <i class="fa-brands fa-whatsapp text-lg"></i> व्हॉट्सॲपवर सीट बुक करा
            </button>

        </div>
    </div>

    <script>
        let currentTab = 'sharing';
        let selectedCar = 'ertiga';
        let selectedSeats = [];

        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.booking-section').forEach(sec => sec.classList.add('hidden'));

            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('section-' + tabId).classList.remove('hidden');
        }

        function selectTime(element, timeStr) {
            document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
            document.getElementById('sharing-time').value = timeStr;
        }

        function selectCar(carType) {
            selectedCar = carType;
            selectedSeats = [];
            document.querySelectorAll('.seat').forEach(s => s.classList.remove('selected'));

            if(carType === 'ertiga') {
                document.getElementById('layout-ertiga').classList.remove('hidden');
                document.getElementById('layout-ciaz').classList.add('hidden');
            } else {
                document.getElementById('layout-ciaz').classList.remove('hidden');
                document.getElementById('layout-ertiga').classList.add('hidden');
            }
        }

        function toggleSeat(btn, seatInfo) {
            if(btn.classList.contains('selected')) {
                btn.classList.remove('selected');
                selectedSeats = selectedSeats.filter(s => s !== seatInfo);
            } else {
                btn.classList.add('selected');
                selectedSeats.push(seatInfo);
            }
        }

        function sendWhatsApp() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();

            if (!name || !phone) {
                alert('कृपया तुमचे नाव आणि मोबाईल नंबर टाका!');
                return;
            }

            let message = `*न्यू बुकिंग - गुरुकृपा टूअर्स अँड ट्रॅव्हल्स*\n`;
            message += `*ओनर:* शशी राहणे (9890896040 / 9922862007)\n`;
            message += `----------------------------\n`;
            message += `👤 *ग्राहक:* ${name}\n`;
            message += `📞 *मोबाईल:* ${phone}\n`;

            if (currentTab === 'sharing') {
                const date = document.getElementById('sharing-date').value;
                const time = document.getElementById('sharing-time').value;

                if (!date || !time) return alert('कृपया तारीख आणि वेळ निवडा!');
                if (selectedSeats.length === 0) return alert('कृपया सीट सिलेक्ट करा!');

                message += `🚕 *सेवा:* शेअरिंग टॅक्सी\n`;
                message += `🚘 *गाडी:* ${selectedCar.toUpperCase()}\n`;
                message += `📅 *तारीख:* ${date}\n`;
                message += `⏰ *वेळ:* ${time}\n`;
                message += `💺 *सिलेक्ट केलेल्या सीट:* \n - ${selectedSeats.join('\n - ')}\n`;
            }

            // WhatsApp Redirection to owner
            const whatsappUrl = `https://wa.me/919890896040?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
