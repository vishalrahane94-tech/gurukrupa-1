<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gurukrupa Tours & Travels - Official Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{colors:{redbus:'#d84e55',redbusDark:'#b83238'}}}}</script>
    <style>
       .seat{transition:all 0.2s ease}.seat.selected{background-color:#d84e55!important;color:white!important;border-color:#b83238!important}.seat.selected.price-tag{color:white!important}.tab-btn.active{background-color:#d84e55;color:white;border-color:#d84e55}.time-btn.selected{background-color:#d84e55;color:white;border-color:#d84e55}
    </style>
</head>
<body class="bg-gray-100 font-sans pb-10">
<header class="bg-redbus text-white p-3 shadow-lg sticky top-0 z-50">
<div class="container mx-auto flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-black rounded-full border-2 border-yellow-500 flex items-center justify-center p-1"><span class="text-yellow-500 font-black text-lg">GK</span></div>
<div><h1 class="text-base font-black text-yellow-300 uppercase leading-none">GURUKRUPA</h1><p class="text-[9px] tracking-widest text-white uppercase font-bold">TOURS AND TRAVELS</p></div>
</div>
<div class="flex items-center gap-2">
<div id="user-badge" class="hidden text-xs bg-redbusDark px-2 py-1 rounded border border-yellow-400 font-semibold"><span id="user-name-display"></span> (<span id="user-role-display"></span>)</div>
<button id="logout-btn" onclick="logout()" class="hidden bg-yellow-500 text-black px-2 py-1 rounded text-xs font-bold">बाहेर पडा</button>
</div>
</div>
</header>

<div class="container mx-auto p-3 max-w-xl">
<div id="screen-login" class="bg-white p-5 rounded-xl shadow-lg border mt-4">
<h2 class="text-base font-bold text-center mb-4 border-b pb-2">पोर्टल लॉगिन - Role Nivda</h2>
<div class="grid grid-cols-3 gap-2 mb-5">
<button onclick="selectLoginRole('customer')" id="role-btn-customer" class="p-2 border rounded-lg text-xs font-bold text-center bg-redbus text-white">Customer</button>
<button onclick="selectLoginRole('owner')" id="role-btn-owner" class="p-2 border rounded-lg text-xs font-bold text-center bg-gray-100">Owner</button>
<button onclick="selectLoginRole('driver')" id="role-btn-driver" class="p-2 border rounded-lg text-xs font-bold text-center bg-gray-100">Driver</button>
</div>
<div class="space-y-3">
<input type="text" id="login-name" placeholder="नाव टाका" class="w-full p-2 border rounded text-xs">
<input type="tel" id="login-phone" placeholder="Mobile Number" class="w-full p-2 border rounded text-xs">
<div id="password-field" class="hidden"><input type="password" id="login-pass" placeholder="Password" class="w-full p-2 border rounded text-xs"></div>
<button onclick="handleLogin()" class="w-full bg-redbus text-white font-bold py-2.5 rounded-lg text-xs">लॉगिन करा</button>
<p class="text-[10px] text-center text-green-600 font-bold">✅ Firebase: gurukrupa--tours--travels Connected</p>
</div>
</div>

<div id="screen-customer" class="hidden">
<div class="grid grid-cols-3 gap-1.5 mb-4 text-xs font-semibold">
<button onclick="switchTab('sharing')" id="tab-sharing" class="tab-btn active p-2 rounded-lg border bg-white">1. Sharing</button>
<button onclick="switchTab('oneway')" id="tab-oneway" class="tab-btn p-2 rounded-lg border bg-white">2. One Way</button>
<button onclick="switchTab('airport')" id="tab-airport" class="tab-btn p-2 rounded-lg border bg-white">3. Airport</button>
<button onclick="switchTab('fleet')" id="tab-fleet" class="tab-btn p-2 rounded-lg border bg-white">4. Fleet</button>
<button onclick="switchTab('darshan')" id="tab-darshan" class="tab-btn p-2 rounded-lg border bg-white">5. दर्शन</button>
<button onclick="switchTab('bus')" id="tab-bus" class="tab-btn p-2 rounded-lg border bg-white">6. Bus</button>
</div>

<div class="bg-white p-4 rounded-xl shadow-md border">
<div class="mb-4 bg-gray-50 p-2 rounded text-xs"><span class="font-bold">ग्राहक:</span> <span id="cust-display-name" class="font-semibold text-redbus"></span> (<span id="cust-display-phone"></span>)</div>

<div id="section-sharing" class="booking-section">
<div class="bg-red-50 border border-red-200 text-redbus text-xs font-bold p-2 rounded-lg text-center mb-3">नाशिक ते पुणे शेअरिंग टॅक्सी</div>
<div class="grid grid-cols-2 gap-2 mb-3">
<select id="sharing-pickup" class="w-full p-1.5 border rounded text-xs"><option>ठक्कर बाजार</option><option>द्वारका सर्कल</option><option>मुंबई नाका</option></select>
<select id="sharing-drop" class="w-full p-1.5 border rounded text-xs"><option>चाकण</option><option>मोशी</option><option>नाशिक फाटा</option></select>
</div>
<div class="grid grid-cols-2 gap-2 mb-3">
<input type="date" id="sharing-date" class="w-full p-1.5 border rounded text-xs">
<select id="car-select" class="w-full p-1.5 border rounded text-xs font-bold text-redbus"><option value="ertiga">Ertiga (6 Seater)</option><option value="ciaz">Ciaz (4 Seater)</option></select>
</div>
<div class="mb-3"><label class="text-[11px] font-semibold">वेळ निवडा</label><div class="grid grid-cols-3 gap-1.5 mt-1"><button onclick="selectTime(this,'04:00 AM')" class="time-btn p-1.5 text-[11px] border rounded">04:00 AM</button><button onclick="selectTime(this,'08:00 AM')" class="time-btn p-1.5 text-[11px] border rounded">08:00 AM</button><button onclick="selectTime(this,'09:00 AM')" class="time-btn p-1.5 text-[11px] border rounded">09:00 AM</button></div><input type="hidden" id="sharing-time"></div>

<div class="bg-gray-50 p-3 rounded-lg border-2">
<div class="flex justify-between bg-gray-200 p-1.5 rounded-md mb-2"><button onclick="toggleSeat(this,'F1 - ₹750')" class="seat w-20 h-12 bg-white border-2 border-green-600 rounded flex flex-col items-center justify-center"><span class="text-[10px] font-bold">₹750</span><span class="text-xs font-black">F1</span></button><div class="w-16 h-10 bg-gray-400 text-white rounded flex items-center justify-center text-xs font-bold">Driver</div></div>
<div class="grid grid-cols-3 gap-1.5 bg-gray-200 p-1.5 rounded-md"><button onclick="toggleSeat(this,'M1 - ₹550')" class="seat h-12 bg-white border rounded"><span class="text-[10px]">₹550</span><br><span class="text-xs font-bold">M1</span></button><button onclick="toggleSeat(this,'M2 - ₹550')" class="seat h-12 bg-white border rounded"><span class="text-[10px]">₹550</span><br><span class="text-xs font-bold">M2</span></button><button onclick="toggleSeat(this,'M3 - ₹550')" class="seat h-12 bg-white border rounded"><span class="text-[10px]">₹550</span><br><span class="text-xs font-bold">M3</span></button></div>
</div>
<div class="mt-3 p-2 bg-yellow-50 border rounded text-xs"><p>Seat: <span id="selected-seats-display" class="font-bold text-redbus">काही नाही</span></p><p>Total: <span id="total-fare" class="font-bold">₹0</span></p></div>
<button onclick="confirmBooking('sharing')" class="w-full mt-3 bg-redbus text-white font-bold py-3 rounded-lg text-sm">बुकिंग कन्फर्म करा</button>
</div>

<div id="section-oneway" class="booking-section hidden"><input id="oneway-from" placeholder="From" class="w-full p-2 border rounded text-xs mb-2"><input id="oneway-to" placeholder="To" class="w-full p-2 border rounded text-xs mb-2"><input id="oneway-date" type="date" class="w-full p-2 border rounded text-xs mb-2"><button onclick="confirmBooking('oneway')" class="w-full bg-redbus text-white py-2 rounded text-xs font-bold">One Way Book</button></div>
<div id="section-airport" class="booking-section hidden"><button onclick="confirmBooking('airport')" class="w-full bg-redbus text-white py-2 rounded text-xs">Book Airport</button></div>
<div id="section-fleet" class="booking-section hidden"><button onclick="confirmBooking('fleet')" class="w-full bg-redbus text-white py-2 rounded text-xs">Book Fleet</button></div>
<div id="section-darshan" class="booking-section hidden"><button onclick="confirmBooking('darshan')" class="w-full bg-redbus text-white py-2 rounded text-xs">Book Darshan</button></div>
<div id="section-bus" class="booking-section hidden"><button onclick="confirmBooking('bus')" class="w-full bg-redbus text-white py-2 rounded text-xs">Bus Inquiry</button></div>

<div id="booking-success" class="hidden mt-3 bg-green-100 text-green-700 p-3 rounded text-xs text-center font-bold">✅ Booking Firebase मध्ये Save झाली!</div>
</div>
</div>

<div id="screen-owner" class="hidden bg-white p-4 rounded-xl shadow mt-4"><h2 class="font-bold text-sm mb-2">Owner Dashboard - Live Bookings</h2><div id="owner-bookings-list" class="space-y-2 text-xs">Loading...</div></div>
<div id="screen-driver" class="hidden bg-white p-4 rounded-xl shadow mt-4"><h2 class="font-bold text-sm">Driver Dashboard</h2><div id="driver-bookings-list" class="mt-2 text-xs"></div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyAhFTOcugnyUczs2dbMaEPl42HIFhKyGWI",
  authDomain: "gurukrupa--tours--travels.firebaseapp.com",
  databaseURL: "https://gurukrupa--tours--travels-default-rtdb.firebaseio.com",
  projectId: "gurukrupa--tours--travels",
  storageBucket: "gurukrupa--tours--travels.firebasestorage.app",
  messagingSenderId: "186732465527",
  appId: "1:186732465527:web:c5e9807bdacbbe603d2572",
  measurementId: "G-JHSWK3JBC1"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
let selectedRole='customer', selectedSeats=[], selectedTimeVal='', currentUser=null;
window.selectLoginRole=function(role){selectedRole=role;document.querySelectorAll('[id^=role-btn-]').forEach(b=>b.className='p-2 border rounded-lg text-xs font-bold text-center bg-gray-100');document.getElementById('role-btn-'+role).className='p-2 border rounded-lg text-xs font-bold text-center bg-redbus text-white';if(role==='owner'||role==='driver'){document.getElementById('password-field').classList.remove('hidden')}else{document.getElementById('password-field').classList.add('hidden')}}
window.handleLogin=function(){const name=document.getElementById('login-name').value.trim();const phone=document.getElementById('login-phone').value.trim();const pass=document.getElementById('login-pass').value.trim();if(!name||!phone){alert('नाव आणि मोबाईल टाका');return}if(phone.length!=10){alert('10 अंकी नंबर');return}if((selectedRole==='owner'||selectedRole==='driver')&&!pass){alert('Password टाका');return}currentUser={name,phone,role:selectedRole};const usersRef=ref(db,'users');const newUser=push(usersRef);set(newUser,{name,phone,role:selectedRole,loginTime:new Date().toLocaleString()});document.getElementById('screen-login').classList.add('hidden');document.getElementById('user-badge').classList.remove('hidden');document.getElementById('logout-btn').classList.remove('hidden');document.getElementById('user-name-display').innerText=name;document.getElementById('user-role-display').innerText=selectedRole;if(selectedRole==='customer'){document.getElementById('screen-customer').classList.remove('hidden');document.getElementById('cust-display-name').innerText=name;document.getElementById('cust-display-phone').innerText=phone}else if(selectedRole==='owner'){document.getElementById('screen-owner').classList.remove('hidden');loadOwnerBookings()}else{document.getElementById('screen-driver').classList.remove('hidden');loadOwnerBookings('driver')}}
window.logout=function(){location.reload()}
window.switchTab=function(tab){document.querySelectorAll('.booking-section').forEach(s=>s.classList.add('hidden'));document.getElementById('section-'+tab).classList.remove('hidden');document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.getElementById('tab-'+tab).classList.add('active')}
window.selectTime=function(el,time){document.querySelectorAll('.time-btn').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');selectedTimeVal=time;document.getElementById('sharing-time').value=time}
window.toggleSeat=function(el,seatInfo){el.classList.toggle('selected');if(el.classList.contains('selected')){selectedSeats.push(seatInfo)}else{selectedSeats=selectedSeats.filter(s=>s!==seatInfo)}updateSeatSummary()}
function updateSeatSummary(){document.getElementById('selected-seats-display').innerText=selectedSeats.length?selectedSeats.join(', '):'काही नाही';let total=0;selectedSeats.forEach(s=>{const m=s.match(/₹(\d+)/);if(m)total+=parseInt(m[1])});document.getElementById('total-fare').innerText='₹'+total}
window.confirmBooking=function(type){if(!currentUser){alert('Login kara');return}let bookingData={customerName:currentUser.name,customerPhone:currentUser.phone,bookingType:type,bookingTime:new Date().toLocaleString(),status:'New'};if(type==='sharing'){const pickup=document.getElementById('sharing-pickup').value;const drop=document.getElementById('sharing-drop').value;const date=document.getElementById('sharing-date').value;if(!date||!selectedTimeVal||selectedSeats.length==0){alert('तारीख, वेळ, सीट निवडा');return}bookingData.pickup=pickup;bookingData.drop=drop;bookingData.date=date;bookingData.time=selectedTimeVal;bookingData.seats=selectedSeats;bookingData.totalFare=document.getElementById('total-fare').innerText}else if(type==='oneway'){bookingData.from=document.getElementById('oneway-from').value;bookingData.to=document.getElementById('oneway-to').value;bookingData.date=document.getElementById('oneway-date').value}const bookingsRef=ref(db,'bookings');const newBooking=push(bookingsRef);set(newBooking,bookingData).then(()=>{document.getElementById('booking-success').classList.remove('hidden');setTimeout(()=>document.getElementById('booking-success').classList.add('hidden'),4000);selectedSeats=[];document.querySelectorAll('.seat.selected').forEach(s=>s.classList.remove('selected'));updateSeatSummary()}).catch(e=>alert('Error:'+e.message))}
function loadOwnerBookings(role='owner'){const bookingsRef=ref(db,'bookings');onValue(bookingsRef,(snapshot)=>{const data=snapshot.val();const listEl=document.getElementById(role==='driver'?'driver-bookings-list':'owner-bookings-list');if(!data){listEl.innerHTML='<p>अजून booking नाही</p>';return}let html='';Object.entries(data).reverse().forEach(([key,b])=>{html+=`<div class="border p-2 rounded bg-gray-50"><p><b>${b.customerName}</b> (${b.customerPhone}) - ${b.bookingType}</p><p>तारीख:${b.date||'-'} वेळ:${b.time||b.bookingTime}</p><p>${b.pickup||b.from||'-'} -> ${b.drop||b.to||'-'}</p><p>Seats:${b.seats?b.seats.join(', '):'-'} | Total:${b.totalFare||'-'}</p></div>`});listEl.innerHTML=html})}
</script>
</body>
</html>
