    <!-- JavaScript Script -->
    <script>
        function initiatePayment() {
            let custName = document.getElementById("custName").value.trim();
            if (!custName) {
                alert("कृपया पहिले तुमचे नाव टाका!");
                return;
            }

            // तुमचा UPI ID
            const upiId = "9890896040@ybl"; 
            const advanceAmount = 500; 

            // PhonePe/Google Pay ओपन करण्याची लिंक
            const upiUrl = `upi://pay?pa=${upiId}&pn=Gurukrupa%20Tours&am=${advanceAmount}&cu=INR&tn=Advance%20Booking%20by%20${encodeURIComponent(custName)}`;

            window.location.href = upiUrl;

            // पेमेंट बटण दाबताच व्हॉट्सॲपचा ऑप्शन चालू होईल
            document.getElementById("uploadSection").style.display = "block";
        }

        function sendToWhatsApp() {
            let name = document.getElementById("custName").value.trim() || "दिलेले नाही";
            let phone = document.getElementById("custPhone").value.trim() || "दिलेले नाही";
            
            let oneway = document.getElementById("onewayRoute").value + " (" + document.getElementById("onewayVehicle").value + ")";
            
            const myWhatsAppNumber = "919890896040";
            
            const message = `*गुरुकृपा ट्रॅव्हल्स - नवीन बुकिंग!*%0A%0A` +
                            `👤 *नाव:* ${name}%0A` +
                            `📞 *मोबाईल:* ${phone}%0A` +
                            `🚗 *बुकिंग माहिती:* ${oneway}%0A` +
                            `💰 *पेमेंट केलेले अ‍ॅडव्हान्स:* ₹५००%0A%0A` +
                            `_मी खाली पेमेंटचा स्क्रीनशॉट पाठवत आहे._`;

            const whatsappUrl = `https://wa.me/${myWhatsAppNumber}?text=${message}`;
            
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
