<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gurukrupa Tours & Travels - Owner Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans pb-10">
    <header class="bg-[#d84e55] text-white p-3 shadow-lg">
        <h1 class="text-sm font-bold uppercase"><i class="fa-solid fa-shield-halved"></i> Gurukrupa Owner Control Center</h1>
    </header>

    <div class="container mx-auto p-3 max-w-xl space-y-4 mt-3">
        <div class="bg-white p-4 rounded-xl shadow border">
            <h2 class="text-sm font-bold text-gray-800 mb-3"><i class="fa-solid fa-gauge-high text-red-600"></i> डॅशबोर्ड</h2>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <button onclick="showOwnerView('all')" class="p-2 border rounded bg-red-50 text-red-700 font-bold">सर्व बुकिंग्स</button>
                <button onclick="showOwnerView('driver-balance')" class="p-2 border rounded bg-green-50 text-green-800 font-bold">💰 ड्रायव्हर हिशोब</button>
            </div>
        </div>
        <div id="owner-content-box" class="bg-white p-4 rounded-xl shadow border min-h-[200px] text-xs">
            <p class="text-gray-500 text-center py-6">माहिती लोड होत आहे...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const db = getDatabase(initializeApp({
            databaseURL: "https://gurukrupa--tours--travels-default-rtdb.firebaseio.com"
        }));

        window.showOwnerView = function(category) {
            const box = document.getElementById('owner-content-box');
            if(category === 'driver-balance') {
                onValue(ref(db, 'driver_logs/'), (snap) => {
                    const data = snap.val();
                    if(!data) { box.innerHTML = "ड्रायव्हर हिशोब उपलब्ध नाही"; return; }
                    let html = "<h4 class='font-bold mb-2'>ड्रायव्हर जमा कॅश</h4>";
                    Object.values(data).forEach(l => {
                        html += `<div class="p-2 border-b bg-green-50 mb-1"><b>रक्कम:</b> ₹${l.balance} (तारीख: ${l.date})</div>`;
                    });
                    box.innerHTML = html;
                }, {onlyOnce:true});
            } else {
                onValue(ref(db, 'bookings/'), (snap) => {
                    const data = snap.val();
                    if(!data) { box.innerHTML = "कोणतीही बुकिंग नाही"; return; }
                    let html = "<h4 class='font-bold mb-2'>सर्व बुकिंग्स</h4>";
                    Object.values(data).forEach(b => {
                        html += `<div class="p-2 border-b mb-1"><b>नाव:</b> ${b.customerName} (${b.customerPhone})</div>`;
                    });
                    box.innerHTML = html;
                }, {onlyOnce:true});
            }
        };
        showOwnerView('all');
    </script>
</body>
</html>
